title = "StatusForge local secret scan"

[extend]
useDefault = true

# Generated installs and private local outputs are not project source. Local .env is
# deliberately NOT excluded: an accidental secret in it must be reported.
[[allowlists]]
description = "Generated dependency/build outputs, git metadata and local scratch output (not committed source)"
paths = ['''(^|/)(node_modules|dist|\.git|\.local)/''']

[[allowlists]]
description = "Git-ignored CDK cloud assembly (make infra-synth): asset hashes resemble API keys; the committed infra/ source it is built from is still scanned"
paths = ['''^infra/cdk\.out/''']

[[allowlists]]
description = ".env.example has public, documented placeholder credentials for DynamoDB Local only"
paths = ['''(^|/)\.env\.example$''']

[[allowlists]]
description = "One inert UI test token in a curl example; no real credential is issued"
condition = "AND"
paths = ['''(^|/)web/src/pages/MonitorCreatePage\.test\.tsx$''']
regexes = ['''sfh_secret-once''']
