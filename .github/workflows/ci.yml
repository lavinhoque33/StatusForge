name: Foundation checks

# Local-only verification mirrored in CI. Nothing here has AWS credentials or
# contacts AWS; DynamoDB Local runs as a container on the runner's loopback.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofumpt, golines, vet, race tests, build
        run: make backend-check

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Lint, types, formatting, tests, build
        run: make web-check

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            tools/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Vulnerabilities, production licences, working-tree and history secrets
        run: make security-check

  integration:
    needs: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build the API
        run: cd backend && go build -o ../statusforge ./cmd/statusforge
      - name: Degraded startup, recovery, TTL and format marker
        shell: bash
        run: |
          set -euo pipefail
          set -a; . ./.env.example; set +a
          ./statusforge > degraded-start.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/health/live >/dev/null; then break; fi
            sleep 0.5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health/live)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health/ready)" = 503
          docker compose --env-file .env.example up -d --wait dynamodb
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/system > recovered-system.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; s=json.load(open("recovered-system.json")); assert s["dataFormat"] == 6; assert s["ttl"]["attribute"] == "expiresAt"; assert s["ttl"]["status"] in ("ENABLING","ENABLED")'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health/ready)" = 200
      - name: Start DynamoDB Local (loopback, persistent volume)
        run: docker compose --env-file .env.example up -d --wait dynamodb
      - name: DynamoDB-backed store, upgrade, export/import, and M7 cloud-path drill tests
        run: cd backend && go test -race -count=1 ./internal/store ./internal/upgrade ./internal/dataexport ./internal/cloudwork ./internal/cloudtargetpolicy
      - name: Readiness against real DynamoDB Local, then degraded, then restored
        shell: bash
        run: |
          set -euo pipefail
          set -a; . ./.env.example; set +a
          ./statusforge & echo $! > api.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health/live >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8080/api/health/live | grep -q '"status":"ok"'
          curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:8080/api/health/ready | grep -qx 200
          grep -q '"dynamodb":{"status":"ready"}' ready.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = 404
          docker compose --env-file .env.example stop dynamodb
          curl -s -o degraded.json -w '%{http_code}' http://127.0.0.1:8080/api/health/ready | grep -qx 503
          grep -q '"status":"degraded"' degraded.json
          docker compose --env-file .env.example up -d --wait dynamodb
          curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health/ready | grep -qx 200
          kill "$(cat api.pid)"; wait "$(cat api.pid)" || true
      - name: Guards reject non-loopback bind and hosted endpoint
        shell: bash
        run: |
          # Each command must exit 1 before listening; `|| rc=$?` keeps bash -e from aborting on the expected failure.
          expect_exit1() { local rc=0; "$@" || rc=$?; test "$rc" -eq 1 || { echo "expected exit 1, got $rc for: $*"; return 1; }; }
          expect_exit1 env STATUSFORGE_HTTP_ADDR=0.0.0.0:8080 STATUSFORGE_DYNAMODB_ENDPOINT=http://127.0.0.1:8000 ./statusforge
          expect_exit1 env STATUSFORGE_DYNAMODB_ENDPOINT=https://dynamodb.us-east-1.amazonaws.com ./statusforge
          expect_exit1 env -u STATUSFORGE_DYNAMODB_ENDPOINT ./statusforge
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail 100
          cat ready.json degraded.json 2>/dev/null || true
      - name: Stop DynamoDB Local
        if: always()
        run: docker compose --env-file .env.example down --volumes
